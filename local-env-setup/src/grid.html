<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid checkup — web-bootcamp</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/bootcamp-theme.css">
</head>

<body>
    <main class="bc-shell" style="display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px">
        <p class="bc-eyebrow">Week 2 · CSS grid</p>
        <h1 style="font-size:clamp(1.8rem,4vw,2.6rem);margin:0">Grid checkup</h1>
        <p class="bc-muted" style="max-width:36rem;margin:0 0 28px">
            Recreate this layout using a single <code>display: grid</code> container.
            Seven items, five columns, four rows — no absolute positioning.
        </p>

        <div class="container">
            <div class="item item--1"></div>
            <div class="item item--2"></div>
            <div class="item item--3"></div>
            <div class="item item--4"></div>
            <div class="item item--5"></div>
            <div class="item item--6"></div>
            <div class="item item--7"></div>
        </div>
    </main>
</body>

</html>

<style>
    .container {
        width: 500px;
        height: 500px;
        max-width: 90vw;
        display: grid;
        background: #0b1120;
        border: 1px solid var(--border);
        border-radius: 16px;
        overflow: hidden;
        box-shadow: var(--shadow);
        grid-template-columns: 40px 10% 50% 10% 40px;
        grid-template-rows: 25% 25% 25% 25%;
        justify-content: end;
    }

    /* Same placement as the classic task — only the palette is on-brand now. */
    .item--1 {
        grid-column: 1 / 3;
        grid-row: 1 / 3;
        background: #6366f1; /* indigo */
    }

    .item--2 {
        grid-column: 3 / 6;
        grid-row: 1 / 2;
        background: #10b981; /* emerald */
    }

    .item--3 {
        grid-column: 4 / 5;
        grid-row: 2 / 4;
        background: #22d3ee; /* cyan */
    }

    .item--4 {
        grid-column: 5 / 6;
        grid-row: 3 / 5;
        background: #f59e0b; /* amber */
    }

    .item--5 {
        grid-column: 1 / 5;
        grid-row: 4 / 5;
        background: #8b5cf6; /* purple */
    }

    .item--6 {
        grid-column: 2 / 4;
        grid-row: 3 / 4;
        background: #f43f5e; /* rose */
    }

    .item--7 {
        grid-column: 5 / 6;
        grid-row: 2 / 3;
        background: #818cf8; /* indigo-light */
    }
</style>
