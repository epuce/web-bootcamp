services:
  web-bootcamp:
    container_name: apache_php
    image: web-bootcamp
    build:
      context: ./
    volumes:
      # Relative to this file, so it works on any machine (no hardcoded path)
      - ./src:/var/www/html/
    ports:
      - "8000:80"

  mysql:
    image: mysql:8.4
    container_name: mysql-server-80
    restart: always
    environment:
      # MySQL 8.4 defaults to the caching_sha2_password plugin, no override needed
      - MYSQL_ROOT_PASSWORD=root_password
      - MYSQL_DATABASE=web-bootcamp-db
    ports:
      - "8082:3306"

  mongodb:
    image: mongo:7
    container_name: mongodb
    environment:
      - MONGO_INITDB_DATABASE=web-bootcamp-db
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=root_password
    ports:
      - "27017:27017"

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    restart: always
    depends_on:
      - mysql
    environment:
      - PMA_HOST=mysql-server-80
    ports:
      - "8083:80"
